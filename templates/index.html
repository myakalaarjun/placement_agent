<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Placement Agent</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5fb;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #3046a5;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 35px;
            font-size: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 17px;
        }

        input[type="file"],
        input[type="text"] {

            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            background: #f8faff;
        }

        button {

            width: 100%;

            margin-top: 30px;

            padding: 16px;

            border: none;

            border-radius: 8px;

            background: #3549aa;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #26398f;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #loading {

            display: none;

            text-align: center;

            margin-top: 25px;

            font-size: 17px;

            font-weight: bold;

            color: #333;
        }

        #error {

            display: none;

            margin-top: 20px;

            padding: 15px;

            background: #ffe5e5;

            color: #b00020;

            border-radius: 8px;
        }

        #result {

            display: none;

            margin-top: 30px;

            padding: 25px;

            background: #f8f9ff;

            border-radius: 10px;

            border: 1px solid #ddd;

            white-space: pre-wrap;

            line-height: 1.6;

            font-size: 16px;
        }

        .result-title {

            font-size: 24px;

            font-weight: bold;

            color: #3046a5;

            margin-bottom: 20px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🎓 Student Placement Agent</h1>

    <div class="subtitle">
        AI Career Assistant for Students
    </div>


    <!-- RESUME -->

    <label>
        Resume PDF
    </label>

    <input
        type="file"
        id="resume"
        accept=".pdf"
    >


    <!-- ROLE -->

    <label>
        Target Job Role
    </label>

    <input
        type="text"
        id="role"
        placeholder="Example: Machine Learning Engineer"
    >


    <!-- GITHUB -->

    <label>
        GitHub Username or URL
    </label>

    <input
        type="text"
        id="github_id"
        placeholder="Example: myakalaarjun"
    >


    <!-- BUTTON -->

    <button
        id="analyzeButton"
        onclick="analyzeProfile()"
    >

        🚀 Analyze My Profile

    </button>


    <!-- LOADING -->

    <div id="loading">

        🤖 Agent is analyzing your profile...
        <br><br>
        Please wait.

    </div>


    <!-- ERROR -->

    <div id="error"></div>


    <!-- RESULT -->

    <div id="result">

        <div class="result-title">
            🎯 Career Analysis
        </div>

        <div id="finalAnswer"></div>

    </div>

</div>


<script>

async function analyzeProfile() {

    const resume =
        document.getElementById("resume").files[0];

    const role =
        document.getElementById("role").value.trim();

    const github =
        document.getElementById("github_id").value.trim();


    // ============================================
    // VALIDATION
    // ============================================

    if (!resume) {

        alert("Please upload your resume PDF.");

        return;
    }


    if (!role) {

        alert("Please enter your target job role.");

        return;
    }


    if (!github) {

        alert("Please enter your GitHub username.");

        return;
    }


    // ============================================
    // UI
    // ============================================

    const button =
        document.getElementById("analyzeButton");

    const loading =
        document.getElementById("loading");

    const result =
        document.getElementById("result");

    const error =
        document.getElementById("error");

    const finalAnswer =
        document.getElementById("finalAnswer");


    button.disabled = true;

    loading.style.display = "block";

    result.style.display = "none";

    error.style.display = "none";


    // ============================================
    // FORM DATA
    // ============================================

    const formData = new FormData();

    formData.append(
        "resume",
        resume
    );

    formData.append(
        "role",
        role
    );

    formData.append(
        "github_id",
        github
    );


    try {

        // ========================================
        // CALL BACKEND
        // ========================================

        const response = await fetch(
            "/analyze",
            {
                method: "POST",
                body: formData
            }
        );


        // ========================================
        // READ RESPONSE
        // ========================================

        const data =
            await response.json();


        // ========================================
        // CHECK ERROR
        // ========================================

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Something went wrong."
            );

        }


        // ========================================
        // GET ONLY FINAL SYNTHESIS
        // ========================================

        const answer =
            data.final_synthesis;


        if (!answer) {

            throw new Error(
                "Agent did not return final output."
            );

        }


        // ========================================
        // SHOW ONLY FINAL ANSWER
        // ========================================

        finalAnswer.textContent =
            answer;


        result.style.display = "block";


    }

    catch (err) {

        error.textContent =
            "❌ Error: " + err.message;

        error.style.display = "block";

    }

    finally {

        loading.style.display = "none";

        button.disabled = false;

    }

}

</script>


</body>

</html>
